<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fuentes.css">
<style>
:root{--azul:#12264A;--noche:#0B1830;--niebla:#F4F6FA;--arena:#F2EBE1;--cielo:#D6E4F5;--coral:#E2603F;--coral-osc:#F07A5C;--gris:#5A6680}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;display:none;will-change:transform,clip-path}
.bg-azul{background:var(--azul);color:#fff}.bg-noche{background:var(--noche);color:#fff}
.bg-niebla{background:var(--niebla);color:var(--azul)}.bg-arena{background:var(--arena);color:var(--azul)}
.bg-cielo{background:var(--cielo);color:var(--azul)}
/* zona segura IG: y 230–1440, dejar libres 230 px a la derecha */
.safe{position:absolute;left:90px;right:230px;top:230px;bottom:480px;display:flex;flex-direction:column;justify-content:center}
.big{font-family:Sora;font-weight:700;font-size:118px;line-height:1.02;letter-spacing:-.035em}
.mid{font-family:Sora;font-weight:600;font-size:88px;line-height:1.06;letter-spacing:-.03em}
.sub{font-family:'DM Sans';font-weight:500;font-size:44px;line-height:1.3;margin-top:40px;opacity:.8}
.w{display:inline-block;will-change:transform,opacity}
.coral{color:var(--coral)}.bg-azul .coral,.bg-noche .coral{color:var(--coral-osc)}
.tag{font-family:'DM Sans';font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:34px;opacity:.7}
/* notificaciones */
.notif{background:#fff;border-radius:34px;padding:26px 30px;margin-bottom:22px;box-shadow:0 18px 40px rgba(18,38,74,.14);display:flex;gap:22px;align-items:center;width:740px}
.notif .av{width:72px;height:72px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:Sora;font-weight:600;font-size:30px;color:#fff;background:#8A97B0}
.notif .tx{font-family:'DM Sans';font-size:34px;line-height:1.25;color:var(--azul)}
.notif .tx b{display:block;font-size:26px;color:var(--gris);font-weight:500;margin-bottom:4px}
/* reloj */
.clock{font-family:Sora;font-weight:700;font-size:260px;letter-spacing:-.05em;line-height:1}
/* tachado */
.strike{position:relative;display:inline-block}
.strike::after{content:"";position:absolute;left:-6px;top:54%;height:12px;background:currentColor;width:var(--s,0%)}
/* red de nodos */
svg.red{position:absolute;left:0;top:0}
.logo{position:absolute;left:90px;top:250px;width:300px}
.cta-btn{display:inline-flex;align-items:center;gap:22px;background:#fff;color:var(--azul);border-radius:999px;padding:30px 46px;font-family:Sora;font-weight:700;font-size:56px;margin-top:50px;align-self:flex-start}
.prog{position:absolute;left:90px;right:230px;top:1475px;height:6px;background:rgba(127,140,170,.25);border-radius:3px}
.prog i{display:block;height:100%;background:currentColor;border-radius:3px;opacity:.6}
.notif .av{width:auto;min-width:110px;height:64px;padding:0 16px;border-radius:20px;font-size:26px}
</style></head>
<body><div id="stage"></div>
<script>
// ===== GUION (cámbialo por reel; ver LEEME de formatos) =====
window.GUION = window.GUION || {
  escenas:[
    {t:'frase', bg:'cielo', ms:2300, texto:'Deja de confirmar citas a mano.', punch:true},
    {t:'notifs',bg:'niebla',ms:3800, tag:'Mañana tienes', items:[
      ['09:00','Rocío','Pendiente de confirmar'],
      ['09:30','Luis','No contesta'],
      ['10:15','Marta','Pendiente de confirmar'],
      ['11:00','Andrés','Buzón de voz'],
      ['12:30','Elena','Pendiente de confirmar'],
      ['13:00','Raúl','No contesta']]},
    {t:'frase', bg:'azul',  ms:2300, texto:'Llamar. Esperar. Volver a llamar.'},
    {t:'giro',  bg:'arena', ms:2800, a:'No es organización.', b:'Es repetición.'},
    {t:'red',   bg:'azul',  ms:2700, texto:'Un recordatorio automático lo hace solo.'},
    {t:'frase', bg:'noche', ms:2400, texto:'Y si alguien cancela, ves el hueco al momento.'},
    {t:'frase', bg:'cielo', ms:2300, texto:'[[Tú]] solo revisas.', punch:true},
    {t:'cta',   bg:'azul',  ms:3000, texto:'Te enseñamos qué se puede automatizar en tu agenda.', palabra:'AUDITORÍA'}
  ]
};
// ============================================================
const E=GUION.escenas, stage=document.getElementById('stage');
let acc=0; E.forEach(e=>{e.start=acc; acc+=e.ms;}); window.DURACION=acc;
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const back=x=>{x=Math.min(Math.max(x,0),1);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const marca=s=>s.replace(/\[\[(.+?)\]\]/g,(m,p)=>'§'+p+'§');
function palabras(s){ // devuelve spans por palabra; §…§ = coral
  let out=[],coral=false; marca(s).split(/(§)/).forEach(seg=>{ if(seg==='§'){coral=!coral;return;}
    seg.split(/(\s+)/).forEach(w=>{ if(!w)return; if(/^\s+$/.test(w)){out.push(' ');return;}
      out.push(`<span class="w${coral?' coral':''}">${w}</span>`);});});
  // une palabra + signo pegado (p. ej. «recepcionista.») para que no se partan de línea
  const g=[]; out.forEach(x=>{ if(x!==' ' && g.length && g[g.length-1]!==' ') g[g.length-1]+=x; else g.push(x); });
  return g.map(x=>x===' '?' ':`<span style="white-space:nowrap">${x}</span>`).join('');
}
E.forEach((e,i)=>{
  const d=document.createElement('div'); d.className='scene bg-'+e.bg; d.id='s'+i; let h='';
  if(e.t==='frase') h=`<div class="safe"><div class="big">${palabras(e.texto)}</div></div>`;
  if(e.t==='notifs') h=`<div class="safe" style="justify-content:flex-start;padding-top:20px"><div class="tag">${e.tag}</div>`+
     e.items.map((n,k)=>`<div class="notif"><div class="av" style="background:${['#8A97B0','#2C4E8A','#6F8FBF','#4A5A78','#9AA9C4','#3B5E96'][k%6]}">${n[0]}</div><div class="tx"><b>${n[1]}</b>${n[2]}</div></div>`).join('')+`</div>`;
  if(e.t==='reloj') h=`<div class="safe"><div class="clock">${e.hora}</div><div class="mid" style="margin-top:40px">${palabras(e.texto)}</div></div>`;
  if(e.t==='giro') h=`<div class="safe"><div class="mid"><span class="strike a">${e.a}</span></div><div class="big b" style="margin-top:50px">${palabras(e.b)}</div></div>`;
  if(e.t==='red') h=`<svg class="red" width="1080" height="1920"></svg><div class="safe" style="justify-content:flex-end;padding-bottom:40px"><div class="mid">${palabras(e.texto)}</div></div>`;
  if(e.t==='cta') h=`<img class="logo" src="../nodo-logo-negativo.svg"><div class="safe"><div class="tag" style="opacity:.8">Auditoría gratuita</div><div class="mid">Comenta<br><span style="color:#fff">${e.palabra}</span> 👇</div><div class="sub">${e.texto}</div><div class="sub" style="font-size:34px;margin-top:24px;opacity:.6">También en el enlace de la bio</div></div>`;
  d.innerHTML=h+`<div class="prog"><i></i></div>`; stage.appendChild(d);
});
// red de nodos: puntos fijos (semilla determinista)
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const NODOS=[]; for(let r=0;r<4;r++)for(let c=0;c<4;c++) if(rnd()>0.15) NODOS.push([150+c*220+(rnd()-.5)*140, 330+r*200+(rnd()-.5)*120]);
const ARISTAS=[]; NODOS.forEach((a,i)=>{ NODOS.forEach((b,j)=>{ if(j>i && Math.hypot(a[0]-b[0],a[1]-b[1])<290) ARISTAS.push([i,j]); }); });

window.renderAt=function(t){
  E.forEach((e,i)=>{
    const d=document.getElementById('s'+i), local=t-e.start;
    const vis = local>=0 && local<e.ms+220;      // solape para la transición
    d.style.display=vis?'block':'none'; if(!vis) return;
    d.style.zIndex=i;
    // entrada: barrido circular desde abajo (240 ms)
    const pin=ease(local/240); d.style.clipPath= i===0?'none':`circle(${pin*150}% at 50% 100%)`;
    d.querySelector('.prog i').style.width=(Math.min(t/DURACION,1)*100)+'%';
    const ws=[...d.querySelectorAll('.big .w, .mid .w')];
    if(e.t==='frase'||e.t==='reloj'||e.t==='red'){
      const t0 = e.t==='reloj'?500 : e.t==='red'?350 : 120, paso = e.punch?110:150;
      ws.forEach((w,k)=>{ const p=back((local-t0-k*paso)/260); w.style.opacity=Math.min(1,(local-t0-k*paso)/120); w.style.transform=`translateY(${(1-p)*60}px) scale(${e.punch&&w.classList.contains('coral')?1+0.25*(1-ease((local-t0-k*paso-200)/400)):1})`; });
    }
    if(e.t==='notifs'){
      d.querySelectorAll('.notif').forEach((n,k)=>{ const p=back((local-250-k*480)/300); n.style.opacity=local>250+k*480?1:0;
        const shake = k>=3 ? Math.sin(local/30)*Math.max(0,1-(local-250-k*480)/250)*8 : 0;
        n.style.transform=`translateX(${(1-p)*-120+shake}px)`; });
    }
    if(e.t==='reloj'){
      const c=d.querySelector('.clock'); const blink=Math.floor(local/500)%2; c.innerHTML=e.hora.replace(':',`<span style="opacity:${blink?0.25:1}">:</span>`);
      c.style.transform=`scale(${1+0.04*Math.max(0,1-local/600)})`;
    }
    if(e.t==='giro'){
      const a=d.querySelector('.a'); a.style.setProperty('--s',(ease((local-700)/350)*104)+'%'); a.style.opacity=local>1100?0.45:1;
      const b=d.querySelector('.b'); b.style.opacity=local>1150?1:0;
      b.querySelectorAll('.w').forEach((w,k)=>{const p=back((local-1150-k*130)/260); w.style.opacity=Math.min(1,Math.max(0,(local-1150-k*130)/120)); w.style.transform=`translateY(${(1-p)*60}px)`;});
    }
    if(e.t==='red'){
      const p=ease(local/1400); const svg=d.querySelector('svg'); let s='';
      ARISTAS.forEach(([a,b],k)=>{ const q=Math.min(1,Math.max(0,p*ARISTAS.length/ (k+1) -0.0)); const A=NODOS[a],B=NODOS[b];
        const f=Math.min(1,Math.max(0,(local-k*45)/300));
        s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${A[0]+(B[0]-A[0])*f}" y2="${A[1]+(B[1]-A[1])*f}" stroke="rgba(255,255,255,.35)" stroke-width="4"/>`;});
      NODOS.forEach((n,k)=>{ const f=Math.min(1,Math.max(0,(local-k*60)/250)); const pulse=1+0.12*Math.sin(local/180+k);
        s+=`<circle cx="${n[0]}" cy="${n[1]}" r="${16*f*pulse}" fill="${k===4?'#F07A5C':'#fff'}"/>`;});
      svg.innerHTML=s;
    }
    if(e.t==='cta'){
      const lg=d.querySelector('.logo'); lg.style.opacity=ease((local-150)/300);
      d.querySelectorAll('.safe > *').forEach((el,k)=>{const p=back((local-250-k*170)/320); el.style.opacity=Math.min(1,Math.max(0,(local-250-k*170)/150)); el.style.transform=`translateY(${(1-p)*50}px)`;});
    }
  });
};
window.renderAt(0);
</script></body></html>
